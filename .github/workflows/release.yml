# Based partially on Alyxia's work, thanks so much!
# zh-CN fork: Windows-only release build. The official workflow also builds
# macOS (codesign/notarization with upstream-only secrets) and submits to
# winget, neither of which applies to this fork.

name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - v*

env:
  VERSION: ${{ github.ref_name }}

# The release job publishes a draft release for the pushed tag; the default
# GITHUB_TOKEN on forks is read-only, so explicitly grant contents write.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0

      - name: Install Windows dependencies
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed git mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 mingw-w64-x86_64-go make

      - name: Install Go dependencies
        shell: msys2 {0}
        run: |
          export GOROOT=/mingw64/lib/go
          export GOPATH=/mingw64
          go get -v
          go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e  # v0.3.3

      - name: Build
        shell: msys2 {0}
        run: |
          make GUI=1 VERSION=${{ env.VERSION }}
          make ARCH=386 VERSION=${{ env.VERSION }}

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem build -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$($h.ToLower())  $($_.Name)"
          }
          # LF line endings so sha256sum -c works on every platform
          [IO.File]::WriteAllText("$PWD/build/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content build/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VencordInstaller-windows
          path: |
            build/*.exe
            build/SHA256SUMS.txt

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: VencordInstaller-windows
          path: build-windows

      - name: Create the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.VERSION }}
          prerelease: true
          draft: true
          files: |
            build-windows/*
